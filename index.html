<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="description" content="Drag task cards onto a 24-hour day schedule. Local-first, with browser reminders.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    <h1>Planner</h1>
  </div>

  <div class="daynav">
    <button id="prev-day" class="btn icon" type="button" aria-label="Previous day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="today-btn" class="btn sm" type="button">Today</button>
    <button id="next-day" class="btn icon" type="button" aria-label="Next day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <h2 id="day-label" class="day-label">—</h2>
  </div>

  <div class="topbar-actions">
    <div class="viewswitch" role="group" aria-label="Calendar view">
      <button id="view-day" class="seg" type="button" aria-pressed="true">Day</button>
      <button id="view-week" class="seg" type="button" aria-pressed="false">Week</button>
    </div>
    <button id="notify-btn" class="btn ghost sm" type="button">Enable reminders</button>
    <button id="theme-btn" class="btn icon" type="button" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="layout">

  <!-- ------------------------------ card tray ------------------------------ -->
  <aside class="tray" id="tray">
    <div class="tray-head">
      <h2>Cards</h2>
      <button id="add-btn" class="btn primary sm" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="plus"><path d="M12 5v14M5 12h14"/></svg>
        New card
      </button>
    </div>

    <form id="compose" class="compose" hidden autocomplete="off">
      <input id="f-title" class="title-input" type="text" placeholder="What needs doing?" required maxlength="200" aria-label="Task title">
      <textarea id="f-notes" class="notes-input" rows="1" placeholder="Notes (optional)" maxlength="2000" aria-label="Notes"></textarea>
      <div class="compose-row">
        <label class="field">
          <span>Length</span>
          <select id="f-duration" aria-label="Duration">
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60" selected>1 hour</option>
            <option value="90">1.5 hours</option>
            <option value="120">2 hours</option>
            <option value="180">3 hours</option>
          </select>
        </label>
        <label class="field">
          <span>Priority</span>
          <select id="f-priority" aria-label="Priority">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
          </select>
        </label>
        <label class="field">
          <span>Remind</span>
          <select id="f-lead" aria-label="Reminder lead time">
            <option value="0">At start</option>
            <option value="5">5 min before</option>
            <option value="15" selected>15 min before</option>
            <option value="60">1 hour before</option>
            <option value="-1">No reminder</option>
          </select>
        </label>
      </div>
      <label class="check-row">
        <input id="f-regular" type="checkbox">
        <span>Regular event — keeps a copy in the tray every time you schedule it</span>
      </label>

      <div class="compose-actions">
        <button type="button" id="cancel-compose" class="btn ghost sm">Cancel</button>
        <button type="submit" class="btn primary sm">Add card</button>
      </div>
    </form>

    <section class="tray-section" id="regular-section" hidden>
      <h3 class="section-label">Regular <span class="count" id="regular-count">0</span></h3>
      <div id="regular-list" class="tray-list"></div>
    </section>

    <section class="tray-section">
      <h3 class="section-label">Unscheduled <span class="count" id="tray-count">0</span></h3>
      <div id="tray-list" class="tray-list"></div>
      <p id="tray-empty" class="tray-empty" hidden>No unscheduled cards. Drag one off the calendar to park it here.</p>
    </section>

    <div class="tray-foot">
      <button id="toggle-done" class="btn ghost sm" type="button" aria-expanded="false">Show completed (0)</button>
      <div id="done-list" class="tray-list done-list" hidden></div>
    </div>
  </aside>

  <!-- ------------------------------- calendar ------------------------------ -->
  <section class="calendar" id="calendar" aria-label="Day schedule">
    <div class="week-head" id="week-head" hidden></div>
    <div class="cal-scroll" id="cal-scroll">
      <div class="cal-inner" id="cal-inner">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <div class="lanes" id="lanes">
          <div class="today-col" id="today-col" hidden></div>
          <div class="now-line" id="now-line" hidden><span class="now-dot"></span></div>
          <div class="drop-preview" id="drop-preview" hidden></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <span>Saved locally in this browser.</span>
  <span class="hint">Click a card to edit · drag it onto the grid · drag its bottom edge to resize · drag it back to the tray to unschedule</span>
  <span class="spacer"></span>
  <button id="export-btn" class="btn ghost sm" type="button">Export</button>
  <button id="import-btn" class="btn ghost sm" type="button">Import</button>
  <button id="clear-done" class="btn ghost sm" type="button">Clear done</button>
  <input id="import-file" type="file" accept="application/json" hidden>
</footer>

<dialog id="editor" class="editor" aria-labelledby="editor-heading">
  <form id="editor-form" class="editor-form" autocomplete="off">
    <h2 id="editor-heading">Edit card</h2>

    <label class="field-block">
      <span>Title</span>
      <input id="e-title" class="title-input" type="text" required maxlength="200">
    </label>

    <label class="field-block">
      <span>Notes</span>
      <textarea id="e-notes" class="notes-input" rows="3" maxlength="2000"></textarea>
    </label>

    <div class="compose-row three">
      <label class="field">
        <span>Length</span>
        <select id="e-duration" aria-label="Duration"></select>
      </label>
      <label class="field">
        <span>Priority</span>
        <select id="e-priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="normal">Normal</option>
          <option value="high">High</option>
        </select>
      </label>
      <label class="field">
        <span>Remind</span>
        <select id="e-lead" aria-label="Reminder lead time">
          <option value="0">At start</option>
          <option value="5">5 min before</option>
          <option value="15">15 min before</option>
          <option value="60">1 hour before</option>
          <option value="-1">No reminder</option>
        </select>
      </label>
    </div>

    <label class="check-row">
      <input id="e-regular" type="checkbox">
      <span>Regular event — keeps a copy in the tray every time you schedule it</span>
    </label>

    <p id="e-when" class="editor-when"></p>

    <div class="editor-actions">
      <button type="button" id="e-delete" class="btn danger sm">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="e-cancel" class="btn ghost sm">Cancel</button>
      <button type="submit" class="btn primary sm">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="./app.js"></script>
</body>
</html>
